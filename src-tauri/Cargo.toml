[package]
name = "spotify-custom-player"
version = "1.0.0"
description = "Spotify Custom Multiplatform Player (REA Core)"
authors = ["Lead Reverse Engineer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "window-start-dragging", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
